<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stamarc Cloud | Personal Cloud Storage</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.3);
        }
        .drag-active {
            border-color: #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.05) !important;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- Top Navigation Bar -->
    <header class="h-16 border-b border-gray-800 bg-gray-950 px-6 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2 rounded-xl shadow-lg shadow-blue-500/20">
                <i data-lucide="cloud" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">Stamarc Cloud</h1>
                <span class="text-xs text-blue-400 font-medium tracking-wider uppercase">by Stamarc Studios</span>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="flex-1 max-w-xl mx-8">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Buscar en Stamarc Cloud..." class="w-full bg-gray-900 border border-gray-800 text-sm rounded-lg pl-9 pr-4 py-2 text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors">
            </div>
        </div>

        <!-- Right User Actions -->
        <div class="flex items-center space-x-4">
            <button id="uploadBtnTop" class="hidden sm:flex items-center space-x-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all shadow-md shadow-blue-600/20">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                <span>Subir archivo</span>
            </button>
            <div class="h-8 w-[1px] bg-gray-800"></div>
            <div class="flex items-center space-x-3 cursor-pointer">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-sm text-white shadow-md">
                    SS
                </div>
                <div class="hidden md:block">
                    <p class="text-sm font-medium leading-none">Stamarc Admin</p>
                    <p class="text-xs text-gray-400 mt-0.5">admin@stamarc.com</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Left Sidebar -->
        <aside class="w-64 border-r border-gray-800 bg-gray-950 p-4 flex flex-col justify-between hidden md:flex">
            <div class="space-y-6">
                <!-- Action Button -->
                <button id="uploadBtnSide" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 shadow-lg shadow-blue-600/20 transition-all">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    <span>Nuevo archivo</span>
                </button>

                <!-- Navigation Links -->
                <nav class="space-y-1">
                    <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-blue-600/10 text-blue-400 font-medium text-sm">
                        <i data-lucide="hard-drive" class="w-4 h-4"></i>
                        <span>Mis Archivos</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-900 hover:text-gray-200 text-sm transition-colors">
                        <i data-lucide="clock" class="w-4 h-4"></i>
                        <span>Recientes</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-900 hover:text-gray-200 text-sm transition-colors">
                        <i data-lucide="star" class="w-4 h-4"></i>
                        <span>Favoritos</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-900 hover:text-gray-200 text-sm transition-colors">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                        <span>Papelera</span>
                    </a>
                </nav>

                <div class="pt-4 border-t border-gray-800">
                    <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider px-3">Categorías</span>
                    <div class="mt-2 space-y-1">
                        <button onclick="filterCategory('all')" class="w-full flex items-center justify-between px-3 py-2 text-sm text-gray-400 hover:bg-gray-900 hover:text-gray-200 rounded-lg">
                            <span class="flex items-center space-x-2"><i data-lucide="layers" class="w-4 h-4 text-blue-400"></i><span>Todos</span></span>
                            <span id="count-all" class="text-xs bg-gray-800 px-2 py-0.5 rounded-full">0</span>
                        </button>
                        <button onclick="filterCategory('images')" class="w-full flex items-center justify-between px-3 py-2 text-sm text-gray-400 hover:bg-gray-900 hover:text-gray-200 rounded-lg">
                            <span class="flex items-center space-x-2"><i data-lucide="image" class="w-4 h-4 text-emerald-400"></i><span>Imágenes</span></span>
                            <span id="count-images" class="text-xs bg-gray-800 px-2 py-0.5 rounded-full">0</span>
                        </button>
                        <button onclick="filterCategory('documents')" class="w-full flex items-center justify-between px-3 py-2 text-sm text-gray-400 hover:bg-gray-900 hover:text-gray-200 rounded-lg">
                            <span class="flex items-center space-x-2"><i data-lucide="file-text" class="w-4 h-4 text-amber-400"></i><span>Documentos</span></span>
                            <span id="count-documents" class="text-xs bg-gray-800 px-2 py-0.5 rounded-full">0</span>
                        </button>
                        <button onclick="filterCategory('media')" class="w-full flex items-center justify-between px-3 py-2 text-sm text-gray-400 hover:bg-gray-900 hover:text-gray-200 rounded-lg">
                            <span class="flex items-center space-x-2"><i data-lucide="film" class="w-4 h-4 text-purple-400"></i><span>Multimedia</span></span>
                            <span id="count-media" class="text-xs bg-gray-800 px-2 py-0.5 rounded-full">0</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Storage Indicator -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-3">
                <div class="flex items-center justify-between text-xs text-gray-400">
                    <span>Almacenamiento</span>
                    <span id="storageText" class="font-medium text-gray-200">0 MB / 10 GB</span>
                </div>
                <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden">
                    <div id="storageBar" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full w-0 transition-all duration-300"></div>
                </div>
                <p class="text-xs text-gray-500">Servidor Privado local de Stamarc Studios</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main id="dropZone" class="flex-1 bg-gray-900 flex flex-col p-6 overflow-hidden relative transition-all">
            
            <!-- Hidden Input for File Selector -->
            <input type="file" id="fileInput" class="hidden" multiple>

            <!-- Top Header Controls -->
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-xl font-bold text-gray-100 flex items-center space-x-2">
                        <span>Mis Archivos</span>
                        <span id="currentFilterLabel" class="text-xs bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-0.5 rounded-full font-normal">Todos</span>
                    </h2>
                    <p class="text-xs text-gray-400 mt-1">Arrastra y suelta tus archivos en cualquier lugar para subirlos</p>
                </div>

                <div class="flex items-center space-x-2 border border-gray-800 bg-gray-950 p-1 rounded-lg">
                    <button id="viewGrid" class="p-1.5 rounded text-blue-400 bg-gray-800 hover:text-white transition-colors">
                        <i data-lucide="grid" class="w-4 h-4"></i>
                    </button>
                    <button id="viewList" class="p-1.5 rounded text-gray-400 hover:text-white transition-colors">
                        <i data-lucide="list" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Drag & Drop Zone Overlay / Guide -->
            <div id="dropOverlay" class="absolute inset-0 bg-blue-600/10 border-2 border-dashed border-blue-500 m-4 rounded-2xl flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity z-20 backdrop-blur-sm">
                <i data-lucide="upload-cloud" class="w-16 h-16 text-blue-400 animate
